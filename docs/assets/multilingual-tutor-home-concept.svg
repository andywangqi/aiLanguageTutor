<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc">
  <title id="title">AI Language Tutor 多语言首页 UI 概念图</title>
  <desc id="desc">产品概念图，展示以简体中文表达意思并练习日语的固定示例预览，含试听、复述与进入真实对话操作。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f8ff"/><stop offset="1" stop-color="#eef5f2"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6256e8"/><stop offset="1" stop-color="#4840c9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#20254a" flood-opacity=".10"/></filter>
    <style>
      text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#172033}.muted{fill:#69738a}.small{font-size:13px}.label{font-size:12px;font-weight:700;letter-spacing:1.2px}.body{font-size:16px}.title{font-size:56px;font-weight:750;letter-spacing:-2px}.shadow{filter:url(#shadow)}
    </style>
  </defs>
  <rect width="1440" height="1120" fill="url(#bg)"/>
  <circle cx="1265" cy="155" r="155" fill="#e6e3ff" opacity=".52"/>
  <circle cx="110" cy="520" r="120" fill="#dff4eb" opacity=".55"/>

  <!-- Navigation -->
  <g transform="translate(96 42)">
    <rect width="42" height="42" rx="13" fill="url(#accent)"/>
    <path d="M12 22c0-5 4-9 9-9h9M30 20c0 5-4 9-9 9h-9M19 17l6 10" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
    <text x="54" y="28" font-size="19" font-weight="700">AI Language Tutor</text>
    <text x="532" y="27" class="body muted">How it works</text>
    <text x="660" y="27" class="body muted">Languages</text>
    <text x="770" y="27" class="body muted">Pricing</text>
    <text x="1040" y="27" class="body" font-weight="600">Sign in</text>
    <rect x="1112" y="-5" width="136" height="48" rx="15" fill="#172033"/>
    <text x="1134" y="25" fill="#fff" font-size="14" font-weight="700">Start practicing</text>
  </g>

  <!-- Hero copy -->
  <g transform="translate(112 190)">
    <rect width="288" height="34" rx="17" fill="#eeedff"/>
    <circle cx="17" cy="17" r="5" fill="#6256e8"/>
    <text x="31" y="21" fill="#5048c8" class="label" letter-spacing=".5">AI LANGUAGE TUTOR · REAL CONVERSATIONS</text>
    <text x="0" y="112" class="title">Practice Real</text>
    <text x="0" y="174" class="title">Conversations With</text>
    <text x="0" y="236" class="title">an AI Language Tutor</text>
    <text x="2" y="290" class="body muted" font-size="18">Explain what you mean in your own language, get a</text>
    <text x="2" y="319" class="body muted" font-size="18">natural phrase, and use it in your next conversation.</text>
    <rect x="0" y="365" width="202" height="58" rx="17" fill="url(#accent)"/>
    <text x="28" y="401" fill="#fff" font-size="16" font-weight="700">Start speaking free</text>
    <path d="M171 393h11m-5-5 5 5-5 5" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="457" class="small muted">Try a guided practice flow · Text-first option available</text>
    <g transform="translate(0 506)">
      <circle cx="10" cy="10" r="10" fill="#e1f4eb"/><path d="m6 10 3 3 6-7" stroke="#24835b" stroke-width="1.8" fill="none"/>
      <text x="29" y="15" class="small muted">Start in a language you already speak</text>
    </g>
  </g>

  <!-- Demo card -->
  <g class="shadow" transform="translate(756 148)">
    <rect width="574" height="704" rx="30" fill="#fff"/>
    <rect x="24" y="22" width="526" height="44" rx="14" fill="#fafaff"/>
    <circle cx="46" cy="44" r="5" fill="#f0b94d"/>
    <text x="61" y="49" class="label" fill="#666b80" letter-spacing=".7">EXAMPLE PREVIEW</text>
    <text x="421" y="49" class="small muted">Fixed sample</text>

    <text x="34" y="108" class="label muted">YOUR LANGUAGE PAIR</text>
    <rect x="30" y="126" width="244" height="72" rx="17" fill="#f7f7fc" stroke="#e7e8f0"/>
    <text x="48" y="153" class="small muted">I speak</text><text x="48" y="180" font-size="18" font-weight="650">🇨🇳  简体中文</text>
    <rect x="300" y="126" width="244" height="72" rx="17" fill="#f7f7fc" stroke="#e7e8f0"/>
    <text x="318" y="153" class="small muted">I want to learn</text><text x="318" y="180" font-size="18" font-weight="650">🇯🇵  日本語</text>

    <text x="34" y="242" class="label muted">1 · SAY WHAT YOU MEAN</text>
    <rect x="30" y="260" width="514" height="74" rx="17" fill="#f6f7fa"/>
    <text x="50" y="291" font-size="17" font-weight="550">我想问东京地铁怎么去。</text>
    <text x="50" y="316" class="small muted">A sample of what you want to express</text>

    <text x="34" y="378" class="label muted">2 · GET A NATURAL PHRASE</text>
    <rect x="30" y="396" width="514" height="98" rx="18" fill="#f1f0ff" stroke="#dedbff"/>
    <text x="50" y="435" font-size="23" font-weight="650">東京駅にはどうやって行けばいいですか？</text>
    <text x="50" y="469" class="small" fill="#6860c9">How can I get to Tokyo Station?</text>

    <rect x="30" y="516" width="155" height="48" rx="14" fill="#fff" stroke="#dfe2ec"/>
    <circle cx="53" cy="540" r="11" fill="#efefff"/><path d="m50 535 8 5-8 5z" fill="#5148cf"/>
    <text x="72" y="545" font-size="14" font-weight="650">Listen</text>
    <rect x="198" y="516" width="155" height="48" rx="14" fill="#fff" stroke="#dfe2ec"/>
    <path d="M222 533v14m-6-7a6 6 0 0 0 12 0m-6 12v4m-5 0h10" fill="none" stroke="#5148cf" stroke-width="1.7" stroke-linecap="round"/>
    <text x="242" y="545" font-size="14" font-weight="650">Repeat</text>
    <text x="375" y="545" class="small muted">Optional practice</text>

    <rect x="30" y="590" width="514" height="66" rx="18" fill="#172033"/>
    <text x="57" y="630" fill="#fff" font-size="16" font-weight="700">Continue in a real conversation</text>
    <path d="M500 622h16m-7-7 7 7-7 7" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="30" y="683" class="small muted">Preview uses a fixed example; this is not a live AI response.</text>
  </g>

  <!-- Lower explainer -->
  <g transform="translate(112 925)">
    <text x="0" y="0" class="label" fill="#6256e8">A SIMPLE WAY TO KEEP THE CONVERSATION GOING</text>
    <g transform="translate(0 28)">
      <rect width="352" height="116" rx="20" fill="#fff" opacity=".88"/>
      <circle cx="36" cy="36" r="17" fill="#eeedff"/><text x="31" y="42" fill="#5148cf" font-size="15" font-weight="700">1</text>
      <text x="67" y="40" font-size="16" font-weight="700">Say what you mean</text><text x="67" y="69" class="small muted">Start from your idea, not a perfect sentence.</text>
    </g>
    <g transform="translate(368 28)">
      <rect width="352" height="116" rx="20" fill="#fff" opacity=".88"/>
      <circle cx="36" cy="36" r="17" fill="#eeedff"/><text x="31" y="42" fill="#5148cf" font-size="15" font-weight="700">2</text>
      <text x="67" y="40" font-size="16" font-weight="700">Hear a natural phrase</text><text x="67" y="69" class="small muted">Listen, repeat, or continue by text.</text>
    </g>
    <g transform="translate(736 28)">
      <rect width="352" height="116" rx="20" fill="#fff" opacity=".88"/>
      <circle cx="36" cy="36" r="17" fill="#eeedff"/><text x="31" y="42" fill="#5148cf" font-size="15" font-weight="700">3</text>
      <text x="67" y="40" font-size="16" font-weight="700">Use it in conversation</text><text x="67" y="69" class="small muted">Bring the phrase into your next real turn.</text>
    </g>
  </g>
  <text x="112" y="1100" class="small muted">Concept only · verify supported language pairs, audio behavior, trial terms, and live product capabilities before launch.</text>
</svg>
